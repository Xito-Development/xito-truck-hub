name: Compilar Xito Truck Hub
on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '8.0.x' }
      - name: Puente de telemetría
        run: dotnet publish bridge/XitoTelemetryBridge.csproj -c Release -o desktop/resources/bin
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: Instalador Windows
        working-directory: desktop
        run: |
          npm install --no-audit --no-fund
          npx electron-builder --win nsis --x64 --publish never
      - name: Instalador con interfaz propia
        shell: bash
        run: |
          VER=$(node -p "require('./desktop/package.json').version")
          dotnet build installer/XitoSetup.csproj -c Release -o installer/out -p:Version=$VER
          node installer/pack.js installer/out/XitoTruckHub-Setup.exe "desktop/dist/XitoTruckHub-Setup-base-$VER.exe" "desktop/dist/XitoTruckHub-Setup-$VER.exe"
          rm "desktop/dist/XitoTruckHub-Setup-base-$VER.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: XitoTruckHub-Windows
          path: desktop/dist/XitoTruckHub-Setup-*.exe

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: 'temurin', java-version: '21' }
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: APK Android
        working-directory: mobile
        run: |
          npm install --no-audit --no-fund
          node scripts/copy-ui.js
          npx cap sync android
          cd android && chmod +x gradlew && ./gradlew assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk "../XitoTruckHub-$(node -p "require('../package.json').version").apk"
      - uses: actions/upload-artifact@v4
        with:
          name: XitoTruckHub-Android
          path: mobile/*.apk

  # Publica (o actualiza) la versión en GitHub: el HUB y la app la detectan y avisan para actualizar
  release:
    needs: [windows, android]
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: echo "version=$(node -p "require('./desktop/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with: { path: out, merge-multiple: true }
      - name: Preparar archivos
        run: |
          set -e
          V=${{ steps.v.outputs.version }}
          ls -la out
          cp "out/XitoTruckHub-Setup-$V.exe" out/XitoTruckHub-Setup.exe
          cp "out/XitoTruckHub-$V.apk" out/XitoTruckHub.apk
          node -e "const u=require('./updates.json');console.log('## Xito Truck Hub '+process.argv[1]+'\n\n'+(u.notes||[]).map(n=>'- '+n).join('\n')+'\n\nInstala encima de la versión anterior: se conservan todos tus datos.')" "$V" > notes.md
      - name: Publicar versión
        run: |
          set -e
          V=v${{ steps.v.outputs.version }}
          FILES="out/XitoTruckHub-Setup-${{ steps.v.outputs.version }}.exe out/XitoTruckHub-Setup.exe out/XitoTruckHub-${{ steps.v.outputs.version }}.apk out/XitoTruckHub.apk"
          if gh release view "$V" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "La versión $V ya existía: se reemplazan sus archivos"
            gh release upload "$V" $FILES --clobber --repo "$GITHUB_REPOSITORY"
            gh release edit "$V" --notes-file notes.md --latest --draft=false --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$V" $FILES --title "Xito Truck Hub ${{ steps.v.outputs.version }}" --notes-file notes.md --latest --target "$GITHUB_SHA" --repo "$GITHUB_REPOSITORY"
          fi
      - name: Comprobar que la versión está publicada
        run: |
          set -e
          gh release view "v${{ steps.v.outputs.version }}" --repo "$GITHUB_REPOSITORY" --json tagName,isDraft,assets --jq '"Publicada: \(.tagName) · borrador: \(.isDraft) · archivos: \(.assets | length)"'
