name: Compilar Xito Truck Hub
on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '8.0.x' }
      - name: Puente de telemetría
        run: dotnet publish bridge/XitoTelemetryBridge.csproj -c Release -o desktop/resources/bin
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: Instalador Windows
        working-directory: desktop
        run: |
          npm install --no-audit --no-fund
          npx electron-builder --win nsis --x64 --publish never
      - name: Instalador con interfaz propia
        shell: bash
        run: |
          VER=$(node -p "require('./desktop/package.json').version")
          dotnet build installer/XitoSetup.csproj -c Release -o installer/out -p:Version=$VER
          node installer/pack.js installer/out/XitoTruckHub-Setup.exe "desktop/dist/XitoTruckHub-Setup-base-$VER.exe" "desktop/dist/XitoTruckHub-Setup-$VER.exe"
          rm "desktop/dist/XitoTruckHub-Setup-base-$VER.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: XitoTruckHub-Windows
          path: desktop/dist/XitoTruckHub-Setup-*.exe

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: 'temurin', java-version: '21' }
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: APK Android
        working-directory: mobile
        run: |
          npm install --no-audit --no-fund
          node scripts/copy-ui.js
          npx cap sync android
          cd android && chmod +x gradlew && ./gradlew assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk "../XitoTruckHub-$(node -p "require('../package.json').version").apk"
      - uses: actions/upload-artifact@v4
        with:
          name: XitoTruckHub-Android
          path: mobile/*.apk

  # Publica una versión en GitHub: el HUB la detecta y avisa para actualizar
  release:
    needs: [windows, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: echo "version=$(node -p "require('./desktop/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with: { path: out, merge-multiple: true }
      - name: Copias con nombre fijo (para updates.json)
        run: |
          cp out/*.exe out/XitoTruckHub-Setup.exe
          cp out/*-${{ steps.v.outputs.version }}.apk out/XitoTruckHub.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.v.outputs.version }}
          name: Xito Truck Hub ${{ steps.v.outputs.version }}
          body: Instala encima de la versión anterior; se conservan todos tus datos.
          files: |
            out/*.exe
            out/*.apk
          make_latest: true
